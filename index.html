function formatCount(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
  return String(n);
}

function seeded(seed) {
  const x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

function useParticles(seed, count = 14) {
  return useMemo(() => {
    return Array.from({ length: count }).map((_, i) => {
      const r1 = seeded(seed * 97 + i * 13 + 1);
      const r2 = seeded(seed * 131 + i * 7 + 3);
      const r3 = seeded(seed * 211 + i * 5 + 9);
      const r4 = seeded(seed * 53 + i * 19 + 5);
      return {
        left: 4 + r1 * 90,
        delay: r2 * 6,
        duration: 5 + r3 * 6,
        size: 2 + r4 * 4,
      };
    });
  }, [seed, count]);
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    return true;
  } catch (e) {
    return false;
  }
}

function storageIsAvailable() {

function loadPersistedState() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object") return parsed;
    return null;
  } catch (e) {
    return null;
  }
}

function persistState(state) {

    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  } catch (e) {
    return false;
  }
}

const IDB_NAME = "khurafa_videos_db";
const IDB_STORE = "videos";

function openVideoDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      reject(new Error("no-indexeddb"));
      return;
    }
    const req = window.indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSaveVideo(id, blob) {
  try {
    const db = await openVideoDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put({ id, blob });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    return false;
  }
}

async function idbGetVideo(id) {
  try {
    const db = await openVideoDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).get(id);
      req.onsuccess = () => resolve(req.result ? req.result.blob : null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    return null;
  }
}

async function idbClearAll() {
  try {
    const db = await openVideoDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).clear();
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    return false;
  }
}

async function ensureUserProfile(user) {
  const ref = db.ref("users/" + user.uid);
  const snap = await ref.get();
  if (!snap.exists()) {
    await ref.set({
      name: user.displayName || "مستخدم خُرافة",
      email: user.email || "",
      createdAt: firebase.database.ServerValue.TIMESTAMP,
    });
  }
  return (await ref.get()).val();
}

async function fetchUserProfile(uid) {
  try {
    const snap = await db.ref("users/" + uid).get();
    return snap.exists() ? snap.val() : null;
  } catch (e) {
    return null;
  }
}

async function followRealUser(myUid, targetUid) {
  const updates = {};
  updates["following/" + myUid + "/" + targetUid] = true;
  updates["followers/" + targetUid + "/" + myUid] = true;
  await db.ref().update(updates);
}

async function unfollowRealUser(myUid, targetUid) {
  const updates = {};
  updates["following/" + myUid + "/" + targetUid] = null;
  updates["followers/" + targetUid + "/" + myUid] = null;
  await db.ref().update(updates);
}

function listenVideos(onChange) {
  const ref = db.ref("videos").orderByChild("createdAt");
  const handler = ref.on("value", (snap) => {
    const list = [];
    snap.forEach((child) => {
      list.push({ id: child.key, ...child.val() });
    });
    list.reverse();
    onChange(list);
  });
  return () => ref.off("value", handler);
}

async function publishVideoRecord(record) {
  const ref = db.ref("videos").push();
  const data = { ...record, id: ref.key, createdAt: firebase.database.ServerValue.TIMESTAMP };
  await ref.set(data);
  return ref.key;
}

async function uploadVideoToStorage(uid, videoId, file) {
  const path = "videos/" + uid + "/" + videoId;
  const ref = storage.ref(path);
  await ref.put(file);
  return await ref.getDownloadURL();
}

function RealVideoLayer({ videoId, remoteUrl, playRequested, muted }) {
  const [url, setUrl] = useState(remoteUrl || null);
  const [failed, setFailed] = useState(false);
  const [isLandscape, setIsLandscape] = useState(false);
  const [progress, setProgress] = useState(0);
  const videoRef = useRef(null);
  const bgVideoRef = useRef(null);

  useEffect(() => {
    if (remoteUrl) {
      setUrl(remoteUrl);
      return;
    }
    let objectUrl = null;
    let cancelled = false;
    idbGetVideo(videoId).then((blob) => {
      if (cancelled) return;
      if (blob) {
        objectUrl = URL.createObjectURL(blob);
        setUrl(objectUrl);
      } else {
        setFailed(true);
      }
    });
    return () => {
      cancelled = true;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    };
  }, [videoId, remoteUrl]);

  useEffect(() => {
    const v = videoRef.current;
    const bg = bgVideoRef.current;
    if (!v) return;
    if (playRequested) {
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
      if (bg) {
        const p2 = bg.play();
        if (p2 && p2.catch) p2.catch(() => {});
      }
    } else {
      v.pause();
      if (bg) bg.pause();
    }
  }, [playRequested, url, isLandscape]);

  const handleLoadedMetadata = (e) => {
    const el = e.target;
    if (el.videoWidth && el.videoHeight) {
      setIsLandscape(el.videoWidth > el.videoHeight * 1.05);
    }
  };

  const handleTimeUpdate = (e) => {
    const el = e.target;
    if (el.duration) setProgress(el.currentTime / el.duration);
  };

  const handleSeek = (e) => {
    e.stopPropagation();
    const v = videoRef.current;
    if (!v || !v.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    v.currentTime = ratio * v.duration;
    setProgress(ratio);
  };

  if (failed) {
    return (
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: palette.void2 }}>
        <span style={{ color: palette.lilac, fontFamily: "'Tajawal', sans-serif", fontSize: 12.5 }}>تعذّر تحميل الفيديو</span>
      </div>
    );
  }

  if (!url) {
    return (
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: palette.void2 }}>
        <span style={{ color: palette.lilac, fontFamily: "'Tajawal', sans-serif", fontSize: 12.5 }}>جارٍ تحميل الفيديو ✨</span>
      </div>
    );
  }

  return (
    <div style={{ position: "absolute", inset: 0, background: "#000", overflow: "hidden" }}>
      {isLandscape && (
        <video
          ref={bgVideoRef}
          src={url}
          muted
          loop
          playsInline
          webkit-playsinline="true"
          tabIndex={-1}
          aria-hidden="true"
          style={{
            position: "absolute",
            inset: 0,
            width: "100%",
            height: "100%",
            objectFit: "cover",
            filter: "blur(38px) brightness(0.5) saturate(1.3)",
            transform: "scale(1.2)",
          }}
        />
      )}
      <video
        ref={videoRef}
        src={url}
        muted={muted}
        loop
        playsInline
        webkit-playsinline="true"
        onLoadedMetadata={handleLoadedMetadata}
        onTimeUpdate={handleTimeUpdate}
        style={{
          position: "absolute",
          inset: 0,
          width: "100%",
          height: "100%",
          objectFit: isLandscape ? "contain" : "cover",
        }}
      />
      <div
        onClick={handleSeek}
        style={{ position: "absolute", left: 0, right: 0, bottom: 76, height: 16, zIndex: 17, display: "flex", alignItems: "flex-end", direction: "ltr", cursor: "pointer" }}
      >
        <div style={{ width: "100%", height: 3, background: "rgba(255,255,255,0.22)" }}>
          <div
            style={{
              height: "100%",
              width: `${Math.round(progress * 100)}%`,
              background: `linear-gradient(90deg, ${palette.magenta}, ${palette.gold})`,
              boxShadow: `0 0 6px ${palette.magenta}`,
            }}
          />
        </div>
      </div>
    </div>
  );
}

function AuthScreen() {
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [forgotEmail, setForgotEmail] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);
  const [googleBusy, setGoogleBusy] = useState(false);

  const switchMode = (m) => {
    setMode(m);
    setError("");
    setInfo("");
  };

  const handleLogin = async (e) => {
    e.preventDefault();
    setError("");
    setInfo("");
    const normEmail = email.trim().toLowerCase();
    if (!EMAIL_RE.test(normEmail)) {
      setError("البريد الإلكتروني غير صحيح");
      return;
    }
    if (!password) {
      setError("الرجاء إدخال كلمة المرور");
      return;
    }
    setBusy(true);
    try {
      const cred = await auth.signInWithEmailAndPassword(normEmail, password);
      await ensureUserProfile(cred.user);
      setBusy(false);
    } catch (err) {
      setBusy(false);
      setError(translateAuthError(err));
    }
  };

  const handleSignup = async (e) => {
    e.preventDefault();
    setError("");
    setInfo("");
    const trimmedName = name.trim();
    const normEmail = email.trim().toLowerCase();
    if (!trimmedName) {
      setError("الرجاء إدخال الاسم");
      return;
    }
    if (!EMAIL_RE.test(normEmail)) {
      setError("البريد الإلكتروني غير صحيح");
      return;
    }
    if (password.length < 6) {
      setError("كلمة المرور 6 أحرف على الأقل");
      return;
    }
    if (password !== confirmPassword) {
      setError("كلمتا المرور غير متطابقتين");
      return;
    }
    setBusy(true);
    try {
      const cred = await auth.createUserWithEmailAndPassword(normEmail, password);
      await cred.user.updateProfile({ displayName: trimmedName });
      await db.ref("users/" + cred.user.uid).set({
        name: trimmedName,
        email: normEmail,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
      });
      setBusy(false);
    } catch (err) {
      setBusy(false);
      setError(translateAuthError(err));
    }
  };

  const handleGoogleSignIn = async () => {
    setError("");
    setInfo("");
    setGoogleBusy(true);
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      const result = await auth.signInWithPopup(provider);
      await ensureUserProfile(result.user);
      setGoogleBusy(false);
    } catch (err) {
      setGoogleBusy(false);
      if (err && err.code === "auth/popup-blocked") {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          await auth.signInWithRedirect(provider);
          return;
        } catch (err2) {
          setError(translateAuthError(err2));
          return;
        }
      }
      setError(translateAuthError(err));
    }
  };

  const handleForgotSubmit = async (e) => {
    e.preventDefault();
    setError("");
    setInfo("");
    const normEmail = forgotEmail.trim().toLowerCase();
    if (!EMAIL_RE.test(normEmail)) {
      setError("البريد الإلكتروني غير صحيح");
      return;
    }
    setBusy(true);
    try {
      await auth.sendPasswordResetEmail(normEmail);
      setBusy(false);
      setInfo("تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني ✨");
    } catch (err) {
      setBusy(false);
      setError(translateAuthError(err));
    }
  };

  const errorBox = error ? (
    <p style={{ color: palette.magenta, fontFamily: "'Tajawal', sans-serif", fontSize: 12.5, marginBottom: 10, textAlign: "center" }}>{error}</p>
  ) : null;

  const infoBox = info ? (
    <p style={{ color: palette.cyan, fontFamily: "'Tajawal', sans-serif", fontSize: 12.5, marginBottom: 10, textAlign: "center", lineHeight: 1.6 }}>{info}</p>
  ) : null;

  return (
    <div style={{ position: "relative", width: "100%", maxWidth: 480, height: "100%", overflow: "hidden", background: palette.void, display: "flex", flexDirection: "column" }}>
      <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", justifyContent: "center", padding: "28px 26px", direction: "rtl" }}>
        <div style={{ textAlign: "center", marginBottom: 26 }}>
          <div
            style={{
              width: 60,
              height: 60,
              margin: "0 auto 12px",
              borderRadius: "50%",
              background: `conic-gradient(${palette.magenta}, ${palette.gold}, ${palette.cyan}, ${palette.magenta})`,
              padding: 3,
            }}
          >
            <div style={{ width: "100%", height: "100%", borderRadius: "50%", background: palette.void2, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26 }}>
              ✨
            </div>
          </div>
          <h1 style={{ color: palette.moon, fontFamily: "'Baloo Bhaijaan 2', sans-serif", fontSize: 22, fontWeight: 800, margin: 0 }}>خُرافة</h1>
          <p style={{ color: palette.lilac, fontFamily: "'Tajawal', sans-serif", fontSize: 12.5, marginTop: 4 }}>عالم الفيديو الأسطوري</p>
        </div>

        {(mode === "login" || mode === "signup") && (
          <>
            <div style={{ display: "flex", gap: 8, marginBottom: 18, background: "rgba(255,255,255,0.05)", borderRadius: 999, padding: 4 }}>
              <button
                onClick={() => switchMode("login")}
                style={{
                  flex: 1,
                  padding: "8px 0",
                  borderRadius: 999,
                  border: "none",
                  cursor: "pointer",
                  background: mode === "login" ? `linear-gradient(135deg, ${palette.nebula}, ${palette.magenta})` : "transparent",
                  color: palette.moon,
                  fontFamily: "'Tajawal', sans-serif",
                  fontWeight: 700,
                  fontSize: 13,
                }}
              >
                تسجيل الدخول
              </button>
              <button
                onClick={() => switchMode("signup")}
                style={{
                  flex: 1,
                  padding: "8px 0",
                  borderRadius: 999,
                  border: "none",
                  cursor: "pointer",
                  background: mode === "signup" ? `linear-gradient(135deg, ${palette.nebula}, ${palette.magenta})` : "transparent",
                  color: palette.moon,
                  fontFamily: "'Tajawal', sans-serif",
                  fontWeight: 700,
                  fontSize: 13,
                }}
              >
                إنشاء حساب
              </button>
            </div>

            <button
              onClick={handleGoogleSignIn}
              disabled={googleBusy}
              style={{
                width: "100%",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                gap: 10,
                padding: "11px 0",
                borderRadius: 999,
                border: `1px solid ${palette.moon}33`,
                background: "rgba(255,255,255,0.06)",
                color: palette.moon,
                fontFamily: "'Tajawal', sans-serif",
                fontWeight: 700,
                fontSize: 13,
                cursor: googleBusy ? "not-allowed" : "pointer",
                opacity: googleBusy ? 0.6 : 1,
                marginBottom: 16,
              }}
            >
              <GoogleIcon />
              {googleBusy ? "جارٍ الاتصال بـ Google..." : "متابعة باستخدام Google"}
            </button>

            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
              <div style={{ flex: 1, height: 1, background: `${palette.moon}22` }} />
              <span style={{ color: palette.lilac, fontFamily: "'Tajawal', sans-serif", fontSize: 11.5 }}>أو</span>
              <div style={{ flex: 1, height: 1, background: `${palette.moon}22` }} />
            </div>
          </>
        )}

        {mode === "login" && (
          <form onSubmit={handleLogin}>
            {errorBox}
            <label style={labelStyle}>البريد الإلكتروني</label>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} style={fieldStyle} placeholder="example@mail.com" dir="ltr" />
            <label style={labelStyle}>كلمة المرور</label>
            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} style={fieldStyle} placeholder="••••••••" dir="ltr" />
            <div style={{ textAlign: "left", marginBottom: 14 }}>
              <button type="button" onClick={() => switchMode("forgot")} style={linkBtnStyleShared}>
                نسيت كلمة السر؟
              </button>
            </div>
            <button type="submit" disabled={busy} style={submitBtnStyleShared(!busy)}>
              {busy ? "جارٍ الدخول..." : "دخول"}
            </button>
          </form>
        )}

        {mode === "signup" && (
          <form onSubmit={handleSignup}>
            {errorBox}
            <label style={labelStyle}>الاسم</label>
            <input type="text" value={name} onChange={(e) => setName(e.target.value)} style={fieldStyle} placeholder="اسمك الكامل" />
            <label style={labelStyle}>البريد الإلكتروني</label>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} style={fieldStyle} placeholder="example@mail.com" dir="ltr" />
            <label style={labelStyle}>كلمة المرور</label>
            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} style={fieldStyle} placeholder="6 أحرف على الأقل" dir="ltr" />
            <label style={labelStyle}>تأكيد كلمة المرور</label>
            <input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} style={fieldStyle} placeholder="••••••••" dir="ltr" />
            <button type="submit" disabled={busy} style={submitBtnStyleShared(!busy)}>
              {busy ? "جارٍ الإنشاء..." : "إنشاء حساب"}
            </button>
          </form>
        )}

        {mode === "forgot" && (
          <form onSubmit={handleForgotSubmit}>
            <p style={{ color: palette.moon, fontFamily: "'Baloo Bhaijaan 2', sans-serif", fontWeight: 700, fontSize: 15, marginBottom: 14, textAlign: "center" }}>
              استعادة كلمة المرور
            </p>
            {errorBox}
            {infoBox}
            <label style={labelStyle}>أدخل بريدك الإلكتروني</label>
            <input type="email" value={forgotEmail} onChange={(e) => setForgotEmail(e.target.value)} style={fieldStyle} placeholder="example@mail.com" dir="ltr" />
            <button type="submit" disabled={busy} style={submitBtnStyleShared(!busy)}>
              {busy ? "جارٍ الإرسال..." : "إرسال رابط إعادة التعيين"}
            </button>
            <button type="button" onClick={() => switchMode("login")} style={{ ...linkBtnStyleShared, display: "block", margin: "14px auto 0" }}>
              العودة لتسجيل الدخول
            </button>
          </form>
        )}
      </div>
    </div>
  );
}

function KhurafaApp() {
  const storageOK = useMemo(() => storageIsAvailable(), []);
  const idbOK = useMemo(() => typeof window.File !== "undefined" && typeof window.FileReader !== "undefined", []);
  const persisted = useMemo(() => (storageOK ? loadPersistedState() : null), [storageOK]);

  const [realVideos, setRealVideos] = useState([]);
  const [likedMap, setLikedMap] = useState(() => (persisted && persisted.likedMap) || {});
  const [savedMap, setSavedMap] = useState(() => (persisted && persisted.savedMap) || {});
  const [followMap, setFollowMap] = useState(() => (persisted && persisted.followMap) || {});
  const [shareBumpMap, setShareBumpMap] = useState({});
  const [burstMap, setBurstMap] = useState({});
  const [commentsMap, setCommentsMap] = useState(() => (persisted && persisted.commentsMap) || SEED_COMMENTS);
  const [commentDraft, setCommentDraft] = useState("");
  const [commentsOpenId, setCommentsOpenId] = useState(null);
  const [shareOpenId, setShareOpenId] = useState(null);
  const [view, setView] = useState("feed");
  const [tab, setTab] = useState("foryou");
  const [searchQuery, setSearchQuery] = useState("");
  const [spotlightId, setSpotlightId] = useState(null);
  const [notifications, setNotifications] = useState(() => (persisted && persisted.notifications) || INITIAL_NOTIFICATIONS);
  const [toast, setToast] = useState(null);
  const [createOpen, setCreateOpen] = useState(false);
  const [newCaption, setNewCaption] = useState("");
  const [sceneIndex, setSceneIndex] = useState(0);
  const [profileTab, setProfileTab] = useState("posts");
  const [resetArmed, setResetArmed] = useState(false);
  const [pendingVideoFile, setPendingVideoFile] = useState(null);
  const [pendingVideoUrl, setPendingVideoUrl] = useState(null);
  const [publishing, setPublishing] = useState(false);
  const [muted, setMuted] = useState(true);
  const [activeIndex, setActiveIndex] = useState(0);

  const [authLoading, setAuthLoading] = useState(true);
  const [session, setSession] = useState(null);
  const [followingUids, setFollowingUids] = useState({});
  const [followersCount, setFollowersCount] = useState(0);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (user) => {
      if (!user) {
        setSession(null);
        setAuthLoading(false);
        return;
      }
      const profile = await ensureUserProfile(user).catch(() => null);
      setSession({
        uid: user.uid,
        name: (profile && profile.name) || user.displayName || "مستخدم خُرافة",
        email: user.email || "",
      });
      setAuthLoading(false);
    });
    return () => unsub();
  }, []);

  useEffect(() => {
    auth.getRedirectResult().catch(() => {});
  }, []);

  useEffect(() => {
    if (!session) {
      setFollowingUids({});
      setFollowersCount(0);
      return;
    }
    const followingRef = db.ref("following/" + session.uid);
    const followersRef = db.ref("followers/" + session.uid);
    const onFollowing = followingRef.on("value", (snap) => setFollowingUids(snap.val() || {}));
    const onFollowers = followersRef.on("value", (snap) => setFollowersCount(snap.exists() ? Object.keys(snap.val()).length : 0));
    return () => {
      followingRef.off("value", onFollowing);
      followersRef.off("value", onFollowers);
    };
  }, [session]);

  useEffect(() => {
    const unsub = listenVideos((list) => setRealVideos(list));
    return unsub;
  }, []);

  const videos = useMemo(() => [...realVideos, ...INITIAL_VIDEOS], [realVideos]);

  useEffect(() => {
    const unlockAudio = () => {
      try {
        const a = document.createElement("audio");
        a.muted = false;
        a.volume = 0.01;
        a.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAAABmYWN0BAAAAAAAAABkYXRhAAAAAA==";
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
        window.setTimeout(() => {
          try {
            a.pause();
          } catch (e) {}
        }, 60);
      } catch (e) {}
      setMuted(false);
      window.removeEventListener("click", unlockAudio);
      window.removeEventListener("touchend", unlockAudio);
    };
    window.addEventListener("click", unlockAudio);
    window.addEventListener("touchend", unlockAudio);
    return () => {
      window.removeEventListener("click", unlockAudio);
      window.removeEventListener("touchend", unlockAudio);
    };
  }, []);

  useEffect(() => {
    if (!storageOK) return;
    persistState({ likedMap, savedMap, followMap, commentsMap, notifications });
  }, [storageOK, likedMap, savedMap, followMap, commentsMap, notifications]);

  const showToast = (msg) => {
    const key = Date.now();
    setToast({ msg, key });
    window.setTimeout(() => {
      setToast((t) => (t && t.key === key ? null : t));
    }, 2200);
  };

  const fireBurst = (id) => {
    setBurstMap((m) => ({ ...m, [id]: Date.now() }));
    window.setTimeout(() => {
      setBurstMap((m) => ({ ...m, [id]: 0 }));
    }, 850);
  };

  const handleHeart = (id) => {
    setLikedMap((m) => {
      const next = !m[id];
      if (next) fireBurst(id);
      return { ...m, [id]: next };
    });
  };

  const handleDoubleTap = (id) => {
    setLikedMap((m) => ({ ...m, [id]: true }));
    fireBurst(id);
  };

  const handleSubmitComment = () => {
    const text = commentDraft.trim();
    if (!text || !commentsOpenId) return;
    setCommentsMap((m) => ({
      ...m,
      [commentsOpenId]: [...(m[commentsOpenId] || []), { id: Date.now(), user: session ? toHandle(session.name) : "أنت", avatar: "✨", text }],
    }));
    setCommentDraft("");
  };

  const handleShareAction = async (channel) => {
    const video = videos.find((v) => v.id === shareOpenId);
    if (!video) return;
    const url = `https://khurafa.app/v/${video.id}`;
    const text = `${video.caption} — ${url}`;
    if (channel === "copy") {
      const ok = await copyText(url);
      showToast(ok ? "تم نسخ الرابط ✨" : "تعذّر نسخ الرابط");
    } else if (channel === "whatsapp") {
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank", "noopener,noreferrer");
      showToast("جارٍ فتح واتساب ✨");
    } else if (channel === "twitter") {
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, "_blank", "noopener,noreferrer");
      showToast("جارٍ فتح X ✨");
    } else if (channel === "native") {
      if (navigator.share) {
        try {
          await navigator.share({ title: "خُرافة", text: video.caption, url });
        } catch (e) {}
      } else {
        const ok = await copyText(url);
        showToast(ok ? "تم نسخ الرابط ✨" : "تعذّر النسخ");
      }
    }
    if (video.authorUid) {
      db.ref("videos/" + video.id + "/shares").transaction((cur) => (cur || 0) + 1);
    } else {
      setShareBumpMap((m) => ({ ...m, [video.id]: (m[video.id] || 0) + 1 }));
    }
    setShareOpenId(null);
  };

  const handleSelectVideo = (id) => {
    setSpotlightId(id);
    setTab("foryou");
    setView("feed");
    setActiveIndex(0);
  };

  const handleMarkRead = (id) => {
    setNotifications((prev) => prev.map((n) => (n.id === id ? { ...n, read: true } : n)));
  };

  const handleFileSelected = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (pendingVideoUrl) URL.revokeObjectURL(pendingVideoUrl);
    const url = URL.createObjectURL(file);
    setPendingVideoFile(file);
    setPendingVideoUrl(url);
  };

  const handleClearVideo = () => {
    if (pendingVideoUrl) URL.revokeObjectURL(pendingVideoUrl);
    setPendingVideoFile(null);
    setPendingVideoUrl(null);
  };

  const handleCloseCreate = () => {
    if (publishing) return;
    setCreateOpen(false);
    handleClearVideo();
    setNewCaption("");
    setSceneIndex(0);
  };

  const handlePublish = async () => {
    const text = newCaption.trim();
    if (!text && !pendingVideoFile) return;
    if (!session) {
      showToast("سجّل الدخول أولًا للنشر ✨");
      return;
    }
    setPublishing(true);
    const scene = SCENE_PRESETS[sceneIndex];
    let videoUrl = null;
    let uploadFailed = false;

    try {
      if (pendingVideoFile) {
        const tempId = Date.now().toString();
        videoUrl = await uploadVideoToStorage(session.uid, tempId, pendingVideoFile);
      }

      const record = {
        authorUid: session.uid,
        user: toHandle(session.name),
        avatar: "🌟",
        caption: text || "بلا وصف ✨",
        song: "صوت أصلي — " + session.name,
        likes: 0,
        shares: 0,
        saves: 0,
        colors: scene.colors,
        hasRealVideo: !!videoUrl,
        videoUrl: videoUrl || null,
      };
      await publishVideoRecord(record);
    } catch (err) {
      uploadFailed = true;
    }

    setPublishing(false);
    setCreateOpen(false);
    handleClearVideo();
    setNewCaption("");
    setSceneIndex(0);
    setTab("foryou");
    setView("feed");
    setActiveIndex(0);

    if (uploadFailed) {
      showToast("تعذّر النشر، تحقّق من الاتصال وحاول مجددًا ⚠️");
    } else if (pendingVideoFile) {
      showToast("تم نشر فيديوك الحقيقي على حسابك ✨");
    } else {
      showToast("تم النشر على حسابك ✨");
    }
  };

  const handleResetData = () => {
    if (!resetArmed) {
      setResetArmed(true);
      showToast("اضغط مرة أخرى للتأكيد ⚠️");
      window.setTimeout(() => setResetArmed(false), 3000);
      return;
    }
    try {
      window.localStorage.removeItem(STORAGE_KEY);
    } catch (e) {}
    idbClearAll();
    setLikedMap({});
    setSavedMap({});
    setFollowMap({});
    setShareBumpMap({});
    setCommentsMap(SEED_COMMENTS);
    setNotifications(INITIAL_NOTIFICATIONS);
    setResetArmed(false);
    showToast("تمت إعادة ضبط التفاعلات المحلية على هذا الجهاز ✨");
  };

  const handleToggleRealFollow = async (targetUid) => {
    if (!session || !targetUid || targetUid === session.uid) return;
    try {
      if (followingUids[targetUid]) {
        await unfollowRealUser(session.uid, targetUid);
      } else {
        await followRealUser(session.uid, targetUid);
      }
    } catch (e) {
      showToast("تعذّر تنفيذ العملية، تحقّق من الاتصال ⚠️");
    }
  };

  const handleLogout = async () => {
    try {
      await auth.signOut();
    } catch (e) {}
    setView("feed");
  };

  const baseList = tab === "following" ? videos.filter((v) => (v.authorUid ? !!followingUids[v.authorUid] : !!followMap[v.id])) : videos;
  const feedList = useMemo(() => {
    if (!spotlightId) return baseList;
    const idx = baseList.findIndex((v) => v.id === spotlightId);
    if (idx <= 0) return baseList;
    const copy = [...baseList];
    const [item] = copy.splice(idx, 1);
    return [item, ...copy];
  }, [baseList, spotlightId]);

  const unreadCount = notifications.filter((n) => !n.read).length;

  return (
    <div
      className="khurafa-root"
      style={{ width: "100%", background: `linear-gradient(180deg, ${palette.void} 0%, ${palette.void2} 100%)`, display: "flex", alignItems: "center", justifyContent: "center" }}
    >
      <style>{`
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        .khurafa-root { height: 100vh; height: 100dvh; }
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;900&display=swap');
        @keyframes rise {
          0% { transform: translateY(0); opacity: 0; }
          10% { opacity: 1; }
          85% { opacity: 0.9; }
          100% { transform: translateY(-105vh); opacity: 0; }
        }
        @keyframes auroraDrift {
          0% { transform: translate(-8%, -6%) scale(1); }
          50% { transform: translate(8%, 6%) scale(1.18); }
          100% { transform: translate(-8%, -6%) scale(1); }
        }
        @keyframes spinSlow {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes portalPulse {
          0%, 100% { box-shadow: 0 0 0 0 rgba(255,62,165,0.55); }
          50% { box-shadow: 0 0 0 7px rgba(255,62,165,0); }
        }
        @keyframes burstHeart {
          0% { transform: scale(0.3); opacity: 0; }
          25% { transform: scale(1.25); opacity: 1; }
          65% { transform: scale(1); opacity: 1; }
          100% { transform: scale(1); opacity: 0; }
        }
        @keyframes sparkleOut {
          0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
          30% { opacity: 1; }
          100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1); opacity: 0; }
        }
        @keyframes slideUp {
          from { transform: translateY(100%); }
          to { transform: translateY(0); }
        }
        @keyframes toastPop {
          0% { opacity: 0; transform: translate(-50%, 10px); }
          10% { opacity: 1; transform: translate(-50%, 0); }
          85% { opacity: 1; }
          100% { opacity: 0; transform: translate(-50%, -6px); }
        }
        .khurafa-feed::-webkit-scrollbar { display: none; }
      `}</style>

      {authLoading ? (
        <div style={{ position: "relative", width: "100%", maxWidth: 480, height: "100%", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <span style={{ fontSize: 34 }}>✨</span>
        </div>
      ) : !session ? (
        <AuthScreen />
      ) : (
      <div style={{ position: "relative", width: "100%", maxWidth: 480, height: "100%", overflow: "hidden", background: palette.void }}>
        {view === "feed" && (
          <>
            <div
              style={{
                position: "absolute",
                top: 0,
                left: 0,
                right: 0,
                height: 54,
                zIndex: 30,
              }}
            >
              <div style={{ position: "absolute", left: "50%", top: 16, transform: "translateX(-50%)", display: "flex", flexDirection: "row", alignItems: "center", gap: 20 }}>
                {[
                  { key: "following", label: "متابَعة" },
                  { key: "foryou", label: "لك" },
                ].map((t) => (
                  <button
                    key={t.key}
                    onClick={() => {
                      setTab(t.key);
                      setActiveIndex(0);
                    }}
                    style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 5, padding: 0, margin: 0 }}
                  >
                    <span
                      style={{
                        fontFamily: "'Baloo Bhaijaan 2', sans-serif",
                        fontSize: 15,
                        fontWeight: 700,
                        color: tab === t.key ? palette.moon : `${palette.moon}99`,
                        textShadow: "0 1px 6px rgba(0,0,0,0.6)",
                      }}
                    >
                      {t.label}
                    </span>
                    <span
                      style={{
                        width: tab === t.key ? 20 : 0,
                        height: 2.5,
                        borderRadius: 999,
                        background: `linear-gradient(90deg, ${palette.magenta}, ${palette.gold})`,
                        transition: "width 0.2s ease",
                      }}
                    />
                  </button>
                ))}
              </div>
              <button
                onClick={() => setView("discover")}
                style={{ position: "absolute", right: 16, top: 12, background: "none", border: "none", cursor: "pointer", padding: 4, margin: 0 }}
              >
                <Search style={{ width: 21, height: 21, color: palette.moon, filter: "drop-shadow(0 1px 4px rgba(0,0,0,0.6))" }} />
              </button>
            </div>

            {feedList.length === 0 ? (
              <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, padding: 30, direction: "rtl" }}>
                <span style={{ fontSize: 40 }}>🌌</span>
                <p style={{ color: palette.moon, fontFamily: "'Tajawal', sans-serif", fontSize: 14, textAlign: "center", lineHeight: 1.6 }}>
                  لم تتابع أحدًا بعد
                  <br />
                  تابع مبدعين ليظهر سحرهم هنا
                </p>
                <button
                  onClick={() => setView("discover")}
                  style={{
                    background: `linear-gradient(135deg, ${palette.magenta}, ${palette.gold})`,
                    border: "none",
                    borderRadius: 999,
                    padding: "10px 22px",
                    color: palette.moon,
                    fontFamily: "'Tajawal', sans-serif",
                    fontWeight: 700,
                    fontSize: 13,
                    cursor: "pointer",
                  }}
                >
                  اكتشف مبدعين
                </button>
              </div>
            ) : (
              <div
                className="khurafa-feed"
                onScroll={(e) => {
                  const el = e.currentTarget;
                  if (!el.clientHeight) return;
                  const idx = Math.round(el.scrollTop / el.clientHeight);
                  setActiveIndex(idx);
                }}
                style={{ position: "absolute", inset: 0, overflowY: "scroll", scrollSnapType: "y mandatory", scrollBehavior: "smooth" }}
              >
                {feedList.map((v, i) => (
                  <VideoCard
                    key={v.id}
                    video={{ ...v, shares: (v.shares || 0) + (shareBumpMap[v.id] || 0) }}
                    liked={!!likedMap[v.id]}
                    saved={!!savedMap[v.id]}
                    following={v.authorUid ? !!followingUids[v.authorUid] : !!followMap[v.id]}
                    isOwnPost={!!(v.authorUid && session && v.authorUid === session.uid)}
                    active={i === activeIndex}
                    muted={muted}
                    burstKey={burstMap[v.id]}
                    commentsCount={(commentsMap[v.id] || []).length}
                    onHeart={() => handleHeart(v.id)}
                    onDoubleTap={() => handleDoubleTap(v.id)}
                    onFollow={() => {
                      if (v.authorUid) {
                        if (!session) {
                          showToast("سجّل الدخول للمتابعة ✨");
                          return;
                        }
                        handleToggleRealFollow(v.authorUid);
                      } else {
                        setFollowMap((m) => ({ ...m, [v.id]: !m[v.id] }));
                      }
                    }}
                    onSave={() =>
                      setSavedMap((m) => {
                        const next = !m[v.id];
                        if (next) showToast("تم الحفظ ✨");
                        return { ...m, [v.id]: next };
                      })
                    }
                    onOpenComments={() => setCommentsOpenId(v.id)}
                    onOpenShare={() => setShareOpenId(v.id)}
                    onOpenSound={() => {
                      setSearchQuery(v.song.split("—")[0].trim());
                      setView("discover");
                    }}
                    onUnmuteOnPlay={() => setMuted(false)}
                  />
                ))}
              </div>
            )}
          </>
        )}

        {view === "discover" && (
          <DiscoverView
            query={searchQuery}
            onQueryChange={setSearchQuery}
            videos={videos}
            followMap={followMap}
            onToggleFollow={(id) => setFollowMap((m) => ({ ...m, [id]: !m[id] }))}
            onSelectVideo={handleSelectVideo}
            followingUids={followingUids}
            session={session}
            onToggleRealFollow={handleToggleRealFollow}
          />
        )}

        {view === "inbox" && <InboxView notifications={notifications} onMarkRead={handleMarkRead} />}

        {view === "profile" && (
          <ProfileView
            videos={videos}
            likedMap={likedMap}
            savedMap={savedMap}
            followMap={followMap}
            profileTab={profileTab}
            setProfileTab={setProfileTab}
            onSelectVideo={handleSelectVideo}
            storageOK={storageOK}
            resetArmed={resetArmed}
            onReset={handleResetData}
            session={session}
            onLogout={handleLogout}
            followingCount={Object.keys(followingUids).length}
            followersCount={followersCount}
          />
        )}

        {commentsOpenId ? (
          <CommentsDrawer
            comments={commentsMap[commentsOpenId] || []}
            draft={commentDraft}
            onDraftChange={setCommentDraft}
            onSubmit={handleSubmitComment}
            onClose={() => {
              setCommentsOpenId(null);
              setCommentDraft("");
            }}
          />
        ) : null}

        {shareOpenId ? <ShareDrawer onClose={() => setShareOpenId(null)} onAction={handleShareAction} /> : null}

        {createOpen ? (
          <CreateModal
            caption={newCaption}
            onCaptionChange={setNewCaption}
            sceneIndex={sceneIndex}
            onSceneChange={setSceneIndex}
            onClose={handleCloseCreate}
            onPublish={handlePublish}
            videoUrl={pendingVideoUrl}
            onFileSelected={handleFileSelected}
            onClearVideo={handleClearVideo}
            idbOK={idbOK}
            publishing={publishing}
          />
        ) : null}

        {toast ? <Toast message={toast.msg} /> : null}

        <div
          style={{
            position: "absolute",
            bottom: 0,
            left: 0,
            right: 0,
            zIndex: 30,
            paddingTop: 10,
            paddingBottom: "14px",
            paddingLeft: 20,
            paddingRight: 20,
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            background: `linear-gradient(to top, ${palette.void}f2 45%, transparent)`,
            borderTop: `1px solid ${palette.moon}14`,
          }}
        >
          <NavItem icon={<Home />} label="الرئيسية" active={view === "feed"} onClick={() => setView("feed")} />
          <NavItem icon={<Compass />} label="استكشاف" active={view === "discover"} onClick={() => setView("discover")} />
          <AddButton onClick={() => setCreateOpen(true)} />
          <NavItem icon={<Inbox />} label="الوارد" active={view === "inbox"} badge={unreadCount > 0 ? unreadCount : null} onClick={() => setView("inbox")} />
          <NavItem icon={<User />} label="أنا" active={view === "profile"} onClick={() => setView("profile")} />
        </div>
      </div>
      )}
    </div>
  );
}


const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<KhurafaApp />);

</script>
</body>
</html>
